<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172e2b">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>MOM'S KID HOTEL | Guest &amp; Team Portal</title>
  <script>
    try {
      var savedLang = localStorage.getItem("mkh_lang");
      if (savedLang) document.documentElement.lang = savedLang;
    } catch (e) {}
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap');

    :root {
      color-scheme: light;
      --ink: #18312a;
      --muted: #62726a;
      --paper: #f8f7f2;
      --field: #fffefa;
      --line: #dedcd3;
      --card-bg: rgba(255, 255, 252, .96);
      --green: #205545;
      --green-dark: #153c30;
      --green-light: #e8f3ee;
      --gold: #d4a359;
      --gold-dark: #b88636;
      --coral: #da775b;
      --serif: "Playfair Display", Georgia, "Times New Roman", serif;
      --sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --shadow: 0 8px 30px rgba(24, 49, 42, .07);
      --shadow-hover: 0 14px 40px rgba(24, 49, 42, .13);
      --radius: 10px;
    }

    [data-theme="dark"],
    body.theme-dark {
      color-scheme: dark;
      --ink: #eef4f1;
      --muted: #95a69e;
      --paper: #111816;
      --field: #192420;
      --card-bg: rgba(24, 35, 31, .96);
      --line: #2b3d36;
      --green: #3ea083;
      --green-dark: #276b56;
      --green-light: rgba(62, 160, 131, .15);
      --gold: #e2b36b;
      --gold-dark: #c5974e;
      --coral: #e6856a;
      --shadow: 0 8px 32px rgba(0, 0, 0, .5);
      --shadow-hover: 0 16px 44px rgba(0, 0, 0, .65);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      transition: background-color .25s ease, color .25s ease;
    }

    .role-selector-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 22px;
      background: rgba(0, 0, 0, .04);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--line);
    }
    .role-pill {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 9px 4px;
      border: 1px solid transparent;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 11.5px;
      font-weight: 600;
      transition: all .2s cubic-bezier(.16, 1, .3, 1);
      font-family: inherit;
    }
    .role-pill:hover {
      color: var(--ink);
      background: rgba(255, 255, 255, .5);
    }
    .role-pill.active {
      background: var(--card-bg);
      color: var(--green);
      border-color: rgba(36, 91, 73, .22);
      box-shadow: 0 3px 12px rgba(0, 0, 0, .07);
    }
    .role-pill-icon { font-size: 17px; }

    .demo-mode-card {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 12px 14px;
      margin: 16px 0 22px;
      background: linear-gradient(135deg, rgba(32, 85, 69, .08), rgba(212, 163, 89, .12));
      border: 1px solid rgba(32, 85, 69, .22);
      border-radius: 10px;
      font-size: 13px;
      color: var(--ink);
      line-height: 1.45;
    }
    .demo-mode-icon { font-size: 20px; flex-shrink: 0; line-height: 1; margin-top: 2px; }
    .demo-mode-info strong { display: block; color: var(--green); font-weight: 700; margin-bottom: 2px; }
    .demo-mode-info span { color: var(--muted); font-size: 12px; }

    .demo-code-banner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 18px;
      margin: 16px 0 24px;
      background: rgba(32, 85, 69, .07);
      border: 1.5px dashed var(--green);
      border-radius: 12px;
      text-align: center;
    }
    .demo-code-val {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 9px;
      color: var(--green);
      font-family: monospace;
      padding-left: 9px;
    }
    .btn-autofill-code {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(32, 85, 69, .25);
      transition: background .2s ease, transform .15s ease;
    }
    .btn-autofill-code:hover {
      background: var(--green-dark);
      transform: translateY(-1px);
    }
    .code-input-large {
      font-size: 30px !important;
      letter-spacing: 12px !important;
      text-align: center !important;
      font-weight: 700 !important;
      height: 64px !important;
      font-family: monospace !important;
      border: 2px solid var(--line) !important;
      border-radius: 10px !important;
    }
    .code-input-large:focus-visible {
      border-color: var(--green) !important;
      box-shadow: 0 0 0 4px rgba(32, 85, 69, .15) !important;
    }

    .login-page {
      display: grid;
      grid-template-columns: minmax(320px, 0.92fr) minmax(440px, 1.08fr);
      min-height: 100vh;
    }

    .visual-panel {
      position: relative;
      display: flex;
      align-items: flex-end;
      min-height: 660px;
      padding: 48px;
      overflow: hidden;
      color: #fffefa;
      background-color: #28463c;
      background-image: linear-gradient(180deg, rgba(13, 37, 29, .02) 38%, rgba(13, 37, 29, .62) 100%), url("/bea-1.png");
      background-position: center;
      background-size: cover;
    }

    .login-page[data-role="admin"] .visual-panel {
      background-color: #24463a;
      background-image: linear-gradient(180deg, rgba(14, 37, 30, .08) 18%, rgba(14, 37, 30, .58) 100%), url("https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1500&q=85");
      background-position: center;
    }

    .login-page[data-role="admin"] .visual-copy {
      max-width: 420px;
      padding: 20px 22px;
      border: 1px solid rgba(255, 254, 250, .4);
      background: rgba(18, 43, 35, .78);
      backdrop-filter: blur(7px);
    }

    .login-page[data-role="admin"] .visual-copy h1 { font-size: 36px; }

    .visual-panel::before {
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(255, 254, 250, .28);
      content: "";
      pointer-events: none;
    }

    .visual-copy {
      position: relative;
      max-width: 440px;
      padding: 0 8px 12px;
      animation: arrive .7s ease-out both;
    }

    .visual-copy p {
      margin: 0 0 12px;
      color: #f4c6ad;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .visual-copy h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(38px, 4.2vw, 58px);
      font-weight: 400;
      line-height: 1.05;
    }

    .form-panel {
      display: grid;
      align-content: center;
      justify-items: center;
      padding: 64px 48px;
    }

    .form-content {
      width: min(100%, 410px);
      animation: arrive .55s .08s ease-out both;
    }

    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 66px;
      color: var(--green);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2.2px;
    }

    .wordmark-mark {
      position: relative;
      width: 23px;
      height: 23px;
      border: 1.5px solid var(--green);
      border-radius: 50%;
    }

    .wordmark-mark::after {
      position: absolute;
      top: 5px;
      left: 5px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--coral);
      content: "";
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--coral);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }

    h2 {
      margin: 0;
      font-family: var(--serif);
      font-size: 42px;
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.12;
    }

    .intro {
      margin: 12px 0 34px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .field { margin-top: 20px; }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
    }

    .input-wrap { position: relative; }

    input[type="email"], input[type="password"], input[type="text"] {
      width: 100%;
      height: 52px;
      padding: 0 15px;
      border: 1px solid var(--line);
      border-radius: 3px;
      outline: none;
      background: var(--field);
      color: var(--ink);
      font: inherit;
      font-size: 14px;
      transition: border-color .18s ease, box-shadow .18s ease;
    }
    select {
      width: 100%;
      min-height: 54px;
      padding: 0 15px;
      border: 1px solid var(--line);
      border-radius: 5px;
      outline: none;
      background: var(--field);
      color: var(--ink);
      font: inherit;
      font-size: 14px;
    }
    select:focus-visible {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(36, 91, 73, .13);
    }
    .signup-prompt { margin: 22px 0 6px; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .text-button {
      padding: 0;
      border: 0;
      background: none;
      color: var(--green);
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .text-button:focus-visible { outline: 3px solid rgba(36, 91, 73, .3); outline-offset: 3px; }

    input::placeholder { color: #9aa39d; }

    input:focus-visible {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(36, 91, 73, .13);
    }

    .password-input { padding-right: 72px !important; }

    .show-password {
      position: absolute;
      top: 50%;
      right: 13px;
      padding: 6px 2px;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: var(--green);
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
    }

    .show-password:focus-visible, .recovery:focus-visible, .submit:focus-visible {
      outline: 3px solid rgba(36, 91, 73, .3);
      outline-offset: 3px;
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 18px 0 27px;
    }

    .remember {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: #46564f;
      font-size: 13px;
      cursor: pointer;
    }

    .remember input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--green);
    }

    .recovery {
      padding: 4px 0;
      border: 0;
      background: none;
      color: var(--green);
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      text-decoration: underline;
      text-decoration-color: #aabbb2;
      text-underline-offset: 3px;
    }

    .submit {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 3px;
      background: var(--green);
      color: #fffefa;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      transition: background .18s ease, transform .18s ease;
    }

    .submit:hover { background: var(--green-dark); }
    .submit:active { transform: translateY(1px); }

    .message {
      min-height: 22px;
      margin: 14px 0 0;
      color: var(--green-dark);
      font-size: 13px;
      line-height: 1.5;
    }

    .footnote {
      margin: 30px 0 0;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .form-content.wide { width: min(100%, 720px); }
    .screen-heading { margin-bottom: 28px; }
    .screen-heading h2 { font-size: 38px; }
    .screen-heading .intro { margin-bottom: 0; }

    .field select {
      width: 100%;
      height: 48px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: var(--field);
      color: var(--ink);
      font: inherit;
      font-size: 14px;
    }

    .field select:focus-visible, .field input:focus-visible {
      border-color: var(--green);
      outline: 3px solid rgba(36, 91, 73, .13);
      outline-offset: 1px;
    }

    .hint { margin: 8px 0 0; color: var(--muted); font-size: 12px; line-height: 1.6; }

    .qr-frame { display: grid; justify-items: start; gap: 14px; margin: 20px 0; }
    .qr-frame img {
      width: 184px;
      height: 184px;
      padding: 8px;
      border: 1px solid var(--line);
      background: white;
      image-rendering: pixelated;
    }

    .secret-key {
      display: inline-block;
      max-width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--line);
      background: var(--field);
      color: var(--ink);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .button-secondary {
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: transparent;
      color: var(--green);
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
    }
    .button-secondary:hover { border-color: var(--green); }
    .button-secondary:focus-visible { outline: 3px solid rgba(36, 91, 73, .3); outline-offset: 3px; }
    .button-danger {
      min-height: 38px;
      padding: 0 12px;
      border: 1px solid #d7aaa0;
      border-radius: 5px;
      background: #fff9f6;
      color: #9b3b31;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
    }
    .button-danger:hover { border-color: #a83f34; background: #fff0eb; }
    .button-danger:focus-visible { outline: 3px solid rgba(168, 63, 52, .22); outline-offset: 3px; }

    .dashboard-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 34px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }
    .dashboard-top p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .role-label { color: var(--green); font-size: 12px; font-weight: 700; text-transform: capitalize; }
    .dashboard-section { margin-top: 34px; }
    .dashboard-section h3 { margin: 0 0 14px; font: 400 25px/1.2 var(--serif); }
    .setup-warning { margin: 0 0 16px; padding: 10px 12px; border-left: 3px solid var(--coral); background: #f1eee5; }
    .metric-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .metric-row--manager, .metric-row--staff { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .metric { min-height: 88px; padding: 14px; border: 1px solid var(--line); background: rgba(255, 254, 250, .62); }
    .metric span { display: block; color: var(--green); font-family: var(--serif); font-size: 27px; line-height: 1.1; }
    .metric small { display: block; margin-top: 8px; color: var(--muted); font-size: 11px; }
    .empty-state { color: var(--muted); font-size: 13px; line-height: 1.6; }
    .customer-summary { padding: 17px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .customer-summary strong { font-size: 17px; overflow-wrap: anywhere; }
    .customer-summary > p:last-child { margin: 10px 0 0; color: var(--muted); font-size: 13px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    .data-list { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
    .data-list li {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 12px;
      min-height: 56px;
      padding: 9px 0;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
    }
    .data-list small { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
    .user-role { width: auto !important; min-width: 132px; height: 38px !important; padding: 0 8px !important; font-size: 12px !important; }
    .inline-form { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
    .backup-status { margin: 0 0 12px; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .message.error { color: #a33d30; }
    .message.success { color: var(--green); }
    .code-input { letter-spacing: 4px; text-align: center; font-size: 19px !important; }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 780px) {
      .login-page { grid-template-columns: 1fr; }
      .visual-panel {
        min-height: 220px;
        padding: 28px;
        background-position: center 48%;
      }
      .visual-panel::before { inset: 10px; }
      .visual-copy { padding: 0 4px 4px; }
      .visual-copy p { margin-bottom: 7px; font-size: 10px; }
      .visual-copy h1 { max-width: 360px; font-size: 36px; }
      .form-panel { padding: 38px 24px 48px; }
      .wordmark { margin-bottom: 38px; }
      .metric-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 380px) {
      .form-panel { padding-right: 20px; padding-left: 20px; }
      h2 { font-size: 38px; }
      .form-options { gap: 10px; }
      .remember, .recovery { font-size: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }

    :root {
      --ink: #18312f;
      --muted: #72807a;
      --paper: #f7f6f1;
      --field: #fffefa;
      --line: #e5e4dc;
      --green: #1d554c;
      --green-dark: #153f39;
      --coral: #bd9460;
      --serif: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      --sans: "Aptos", "Segoe UI", sans-serif;
    }

    body { background: var(--paper); }

    .login-page {
      grid-template-columns: minmax(360px, .94fr) minmax(460px, 1.06fr);
      background: var(--paper);
    }

    .visual-panel {
      min-height: 100vh;
      padding: clamp(30px, 5vw, 72px);
      background-color: #183c37;
      background-image:
        linear-gradient(180deg, rgba(11, 28, 27, .14) 0%, rgba(11, 28, 27, .1) 35%, rgba(11, 28, 27, .82) 100%),
        url("/bea-1.png");
      background-position: center;
    }

    .visual-panel::before { inset: 22px; border-color: rgba(255, 255, 255, .42); }
    .visual-copy { width: min(100%, 530px); max-width: 530px; padding: 0 4px 10px; }
    .visual-copy p { color: #ead6ad; letter-spacing: 2.4px; }
    .visual-copy h1 { max-width: 530px; font-size: clamp(42px, 5vw, 68px); }

    .login-page[data-role="admin"] .visual-panel {
      background-image:
        linear-gradient(180deg, rgba(43, 35, 23, .12), rgba(30, 27, 22, .87)),
        url("/bea-1.png");
    }
    .login-page[data-role="manager"] .visual-panel {
      background-image:
        linear-gradient(180deg, rgba(13, 50, 44, .08), rgba(12, 46, 41, .87)),
        url("/bea-1.png");
    }
    .login-page[data-role="staff"] .visual-panel {
      background-image:
        linear-gradient(180deg, rgba(19, 43, 63, .1), rgba(15, 36, 54, .88)),
        url("/bea-1.png");
    }
    .login-page[data-role="customer"] .visual-panel {
      background-image:
        linear-gradient(180deg, rgba(70, 48, 38, .05), rgba(68, 43, 35, .84)),
        url("/bea-1.png");
    }

    .hero-scene { display: none; }
    .hero-scene svg { display: block; width: 100%; height: 100%; }
    .scene-sway { transform-box: fill-box; transform-origin: center bottom; animation: scene-sway 7s ease-in-out infinite alternate; }
    .scene-glow { animation: scene-glow 5s ease-in-out infinite alternate; }
    .visual-copy .hero-caption {
      max-width: 440px;
      margin: 14px 0 0;
      color: rgba(255, 255, 255, .83);
      font-size: 14px;
      font-weight: 400;
      letter-spacing: .1px;
      line-height: 1.65;
      text-transform: none;
    }

    .form-panel {
      min-height: 100vh;
      padding: clamp(34px, 6vw, 88px);
      background:
        radial-gradient(ellipse at top right, rgba(221, 213, 191, .23), transparent 40%),
        var(--paper);
    }
    .form-content { width: min(100%, 430px); }
    .form-content.wide { width: min(100%, 760px); }
    .wordmark {
      gap: 12px;
      margin-bottom: clamp(40px, 8vh, 78px);
      color: var(--ink);
      font-size: 12px;
      letter-spacing: 2.5px;
    }
    .wordmark-mark { width: 30px; height: 30px; border-color: var(--coral); }
    .wordmark-mark::after { top: 7px; left: 7px; width: 13px; height: 13px; background: var(--green); }
    h2 { font-size: clamp(38px, 4vw, 48px); letter-spacing: -.6px; }
    .intro { max-width: 520px; margin-bottom: 30px; }
    .eyebrow { color: #9a7447; letter-spacing: 2px; }
    .field { margin-top: 17px; }
    input[type="email"], input[type="password"], input[type="text"] {
      height: 54px;
      border-radius: 5px;
      background: rgba(255, 255, 252, .9);
    }
    .submit {
      min-height: 54px;
      border-radius: 5px;
      background: #1d554c;
      letter-spacing: .3px;
    }
    .submit:hover { background: #153f39; }
    .button-secondary { border-radius: 5px; }
    .dashboard-top {
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-color: #deddd4;
    }
    .dashboard-top strong { overflow-wrap: anywhere; font-size: 14px; }
    .screen-heading {
      margin: 0 0 28px;
      padding: 25px 28px 24px;
      border: 1px solid #e4e1d6;
      border-radius: 6px;
      background: linear-gradient(135deg, rgba(255, 255, 252, .95), rgba(239, 238, 228, .82));
      box-shadow: 0 12px 30px rgba(41, 51, 43, .045);
    }
    .screen-heading h2 { font-size: clamp(30px, 3vw, 39px); }
    .screen-heading .intro { margin: 8px 0 0; }
    .login-page[data-role="admin"] .screen-heading { border-top: 3px solid #ad8854; }
    .login-page[data-role="manager"] .screen-heading { border-top: 3px solid #2e7465; }
    .login-page[data-role="staff"] .screen-heading { border-top: 3px solid #477da0; }
    .login-page[data-role="customer"] .screen-heading { border-top: 3px solid #bd8061; }
    .dashboard-section {
      margin-top: 26px;
      padding: 21px 23px;
      border: 1px solid #e6e4dc;
      border-radius: 6px;
      background: rgba(255, 255, 252, .72);
    }
    .dashboard-section h3 { font-size: 23px; }
    .metric { border-color: #e4e2d9; border-radius: 5px; background: #fffefa; }
    .metric span { color: #1d554c; }
    .metric small { font-size: 11px; letter-spacing: .2px; }
    .data-list { border-color: #e6e4dc; }
    .data-list li { border-color: #e6e4dc; }

    .system-preferences-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      padding: 10px 14px;
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      flex-wrap: wrap;
    }
    .pref-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .pref-select {
      font-size: 12px;
      height: 32px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--field);
      color: var(--ink);
      font-family: inherit;
    }
    .btn-restore-system {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      height: 32px;
      padding: 0 12px;
      border: 1px solid var(--coral);
      color: var(--coral);
      background: transparent;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      transition: all .2s ease;
      font-family: inherit;
    }
    .btn-restore-system:hover {
      background: var(--coral);
      color: #fff;
    }

    .tab-nav {
      display: flex;
      gap: 6px;
      border-bottom: 1px solid var(--line);
      margin: 20px 0;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .tab-btn {
      background: transparent;
      border: none;
      padding: 9px 15px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      border-radius: 6px 6px 0 0;
      border-bottom: 3px solid transparent;
      white-space: nowrap;
      transition: color .15s, border-color .15s, background .15s;
      font-family: inherit;
    }
    .tab-btn:hover { color: var(--ink); }
    .tab-btn.active {
      color: var(--green);
      border-bottom-color: var(--green);
      background: rgba(36, 91, 73, .08);
    }

    .table-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 16px 0 12px;
      flex-wrap: wrap;
    }
    .search-box { position: relative; display: flex; align-items: center; }
    .table-search {
      font-size: 13px;
      height: 36px;
      padding: 0 12px 0 32px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--field);
      color: var(--ink);
      width: 250px;
      font-family: inherit;
    }
    .search-icon {
      position: absolute;
      left: 10px;
      font-size: 13px;
      opacity: .6;
      pointer-events: none;
    }
    .table-responsive {
      width: 100%;
      overflow-x: auto;
      margin-top: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      text-align: left;
      background: var(--card-bg);
    }
    .data-table th {
      padding: 11px 13px;
      background: rgba(0, 0, 0, .03);
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .5px;
      border-bottom: 1px solid var(--line);
    }
    .data-table td {
      padding: 11px 13px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }
    .data-table tr:hover td { background: rgba(36, 91, 73, .04); }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .4px;
    }
    .badge--available, .badge--active, .badge--checked-in {
      background: rgba(36, 91, 73, .14);
      color: var(--green);
    }
    .badge--occupied, .badge--cancelled {
      background: rgba(218, 119, 91, .15);
      color: var(--coral);
    }
    .badge--cleaning {
      background: rgba(212, 163, 89, .18);
      color: #a16c14;
    }
    .badge--maintenance {
      background: rgba(100, 110, 125, .16);
      color: var(--muted);
    }
    .badge--confirmed {
      background: rgba(43, 114, 186, .14);
      color: #23659e;
    }
    .badge--checked-out {
      background: rgba(100, 110, 125, .14);
      color: var(--muted);
    }
    .badge--role {
      background: rgba(36, 91, 73, .1);
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .btn-action {
      font-size: 11.5px;
      padding: 5px 10px;
      border-radius: 4px;
      border: 1px solid var(--line);
      background: var(--field);
      color: var(--ink);
      cursor: pointer;
      font-weight: 600;
      margin-right: 4px;
      transition: background .15s;
      font-family: inherit;
    }
    .btn-action:hover { background: var(--line); }
    .btn-action--danger { color: #d94a38; border-color: rgba(217, 74, 56, .35); }
    .btn-action--danger:hover { background: #d94a38; color: #fff; }
    .btn-action--success { color: var(--green); border-color: rgba(36, 91, 73, .35); }
    .btn-action--success:hover { background: var(--green); color: #fff; }

    .room-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      margin: 16px 0;
    }
    .room-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card-bg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .room-card:hover { transform: translateY(-2px); }
    .room-card-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .room-card-number { font-size: 13px; font-weight: 700; color: var(--muted); }
    .room-card-body {
      padding: 16px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }
    .room-card-title { font-family: var(--serif); font-size: 18px; margin: 0 0 6px; color: var(--ink); }
    .room-card-desc { font-size: 12.5px; color: var(--muted); margin: 0 0 12px; line-height: 1.4; }
    .room-card-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px dashed var(--line);
    }
    .room-card-price { font-size: 18px; font-weight: 700; color: var(--green); }
    .room-card-price small { font-size: 12px; font-weight: 400; color: var(--muted); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(10, 20, 18, .6);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-content {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      max-width: 520px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 26px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .3);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 12px;
    }
    .modal-header h3 { margin: 0; font-family: var(--serif); font-size: 22px; }
    .btn-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--muted); }

    .toast-notification {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1500;
      background: var(--green-dark);
      color: #fff;
      padding: 12px 20px;
      border-radius: 6px;
      box-shadow: 0 6px 22px rgba(0,0,0,.35);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13.5px;
      animation: scene-arrive .3s ease;
    }

    @keyframes scene-arrive {
      from { opacity: 0; transform: translateY(12px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes scene-sway { from { transform: rotate(-1deg); } to { transform: rotate(1deg); } }
    @keyframes scene-glow { from { opacity: .45; } to { opacity: .9; } }

    @media (max-width: 780px) {
      .login-page { grid-template-columns: 1fr; }
      .visual-panel { min-height: 380px; padding: 34px 30px; }
      .visual-panel::before { inset: 12px; }
      .hero-scene { width: min(100%, 350px); height: 145px; margin-bottom: 18px; }
      .visual-copy h1 { max-width: 500px; font-size: clamp(36px, 8vw, 52px); }
      .visual-copy .hero-caption { display: none; }
      .form-panel { min-height: auto; padding: 42px 28px 56px; }
      .wordmark { margin-bottom: 40px; }
      .screen-heading { padding: 21px; }
      .dashboard-section { padding: 18px; }
      .table-search { width: 100%; }
    }

    @media (max-width: 420px) {
      .visual-panel { min-height: 330px; padding: 27px 24px; }
      .hero-scene { height: 125px; }
      .form-panel { padding-right: 22px; padding-left: 22px; }
      .metric-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .data-list li { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <main class="login-page">
    <section class="visual-panel" aria-label="Mom's Kid Hotel">
      <div class="visual-copy">
        <div class="hero-scene" data-hero-scene aria-hidden="true"></div>
        <p data-hero-eyebrow>THE MOM'S KID HOTEL EXPERIENCE</p>
        <h1 data-hero-title>Welcome to your home away from home.</h1>
        <p class="hero-caption" data-hero-caption>Warm hospitality, thoughtful details, and a stay worth remembering.</p>
      </div>
    </section>

    <section class="form-panel" aria-labelledby="login-title">
      <div class="form-content">
        <header class="system-preferences-bar" aria-label="System Preferences">
          <div class="pref-group">
            <span class="pref-label" title="Current Mode">🌓</span>
            <select id="pref-mode-select" class="pref-select" aria-label="Display mode">
              <option value="auto">Auto Mode</option>
              <option value="light">Light Mode</option>
              <option value="dark">Dark Mode</option>
            </select>
            <select id="pref-lang-select" class="pref-select" aria-label="Language">
              <option value="en">English (EN)</option>
              <option value="fr">Français (FR)</option>
              <option value="es">Español (ES)</option>
              <option value="de">Deutsch (DE)</option>
              <option value="zh">简体中文 (ZH)</option>
              <option value="ja">日本語 (JA)</option>
              <option value="ar">العربية (AR)</option>
              <option value="pt">Português (PT)</option>
              <option value="it">Italiano (IT)</option>
              <option value="ru">Русский (RU)</option>
            </select>
            <select id="pref-time-select" class="pref-select" aria-label="Time format">
              <option value="12h">12-Hour</option>
              <option value="24h">24-Hour</option>
            </select>
          </div>
          <button type="button" class="btn-restore-system" id="btn-restore-preferences" title="Restore system preferences (theme, display mode, time format, language) without altering any data">
            <span aria-hidden="true">🔄</span> Restore Defaults
          </button>
        </header>

        <div class="wordmark" aria-label="Mom's Kid Hotel">
          <span class="wordmark-mark" aria-hidden="true"></span>
          <span>MOM'S KID HOTEL</span>
        </div>

        <div id="app-view" aria-live="polite" aria-busy="true">
          <p class="eyebrow">Your account</p>

        </div>
      </div>
    </section>
  </main>

  <div id="modal-container" aria-hidden="true"></div>
  <div id="toast-container" aria-live="polite"></div>

  <script src="/login-app.js?v=20261018-multilingual-v2" defer></script>
</body>
</html>
